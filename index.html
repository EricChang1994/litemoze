<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiteMoze 6.0 - Global Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="checkbox"] { accent-color: #10b981; width: 1.2rem; height: 1.2rem; cursor: pointer; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex justify-center items-start p-4">

    <div class="w-full max-w-md bg-slate-900 rounded-3xl shadow-2xl p-6 border border-slate-800 min-h-[90vh] flex flex-col justify-between relative">
        
        <div>
            <div class="flex justify-between items-center mb-6">
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-xl font-black tracking-tight text-emerald-400">⚡ LiteMoze 6.0</h1>
                        <button onclick="toggleGlobalSettings(true)" class="text-slate-400 hover:text-emerald-400 transition cursor-pointer bg-slate-800 p-1.5 rounded-lg shadow-sm">⚙️</button>
                    </div>
                    <p data-i18n="app_sub" class="text-[10px] text-slate-500 mt-0.5">專屬國際資產版</p>
                </div>
                <span id="sync-status" class="text-[10px] bg-amber-500/10 text-amber-400 px-2 py-1 rounded-full font-mono font-bold tracking-wider transition-all duration-300">Loading...</span>
            </div>

            <div class="bg-gradient-to-br from-slate-800 to-slate-850 p-6 rounded-2xl border border-slate-700/40 mb-6 shadow-inner relative overflow-hidden">
                <div class="flex justify-between items-center mb-1 relative z-10">
                    <p class="text-xs text-slate-400 font-medium tracking-wide"><span data-i18n="net_worth">總資產淨值估算</span> (<span id="display-base-currency" class="text-emerald-400/80">TWD</span>)</p>
                    <div class="flex gap-1.5">
                        <button onclick="toggleCategoryModal(true)" class="text-slate-400 hover:text-emerald-400 text-[11px] transition flex items-center gap-1 cursor-pointer bg-slate-900/40 px-2 py-1 rounded-lg border border-slate-700/30">
                            <span data-i18n="manage_cat">🏷️ 類別管理</span>
                        </button>
                        <button onclick="toggleSettingsModal(true)" class="text-slate-400 hover:text-emerald-400 text-[11px] transition flex items-center gap-1 cursor-pointer bg-slate-900/40 px-2 py-1 rounded-lg border border-slate-700/30">
                            <span data-i18n="custom_board">⚙️ 自訂看板</span>
                        </button>
                    </div>
                </div>
                <h2 id="total-assets" class="text-3xl font-black tracking-tight text-white font-mono relative z-10">TWD 0</h2>
                
                <div id="dashboard-rates" class="flex flex-col gap-1.5 mt-4 pt-4 border-t border-slate-700/50 text-[11px] text-slate-400 font-mono relative z-10"></div>
                
                <div class="flex gap-2 mt-4 pt-3 border-t border-slate-700/30 relative z-10">
                    <button onclick="openAnalysisModal('group')" class="flex-1 bg-slate-950/60 hover:bg-slate-950 text-slate-300 hover:text-emerald-400 text-xs py-2 px-3 rounded-xl border border-slate-800/60 transition flex items-center justify-center gap-1.5 cursor-pointer font-medium active:scale-95">
                        <span data-i18n="btn_group_stat">📊 分組統計</span>
                    </button>
                    <button onclick="openAnalysisModal('currency')" class="flex-1 bg-slate-950/60 hover:bg-slate-950 text-slate-300 hover:text-emerald-400 text-xs py-2 px-3 rounded-xl border border-slate-800/60 transition flex items-center justify-center gap-1.5 cursor-pointer font-medium active:scale-95">
                        <span data-i18n="btn_cur_stat">🪙 幣種統計</span>
                    </button>
                </div>
            </div>

            <div class="flex justify-between items-center mb-3 px-1">
                <h3 data-i18n="my_assets" class="text-xs font-bold text-slate-400 tracking-wider uppercase">我的資產帳戶</h3>
                <span id="account-count" class="text-[11px] text-slate-500 font-mono">0</span>
            </div>
            
            <div id="asset-list" class="space-y-2.5 max-h-[35vh] overflow-y-auto pr-1 no-scrollbar"></div>
        </div>

        <div class="mt-6 pt-2">
            <button onclick="toggleModal(true)" data-i18n="add_record" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold py-3.5 px-4 rounded-xl transition duration-200 shadow-lg shadow-emerald-500/10 text-center text-sm cursor-pointer active:scale-[0.98]">
                + 新增資產紀錄
            </button>
        </div>
    </div>

    <div id="global-settings-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
        <div class="bg-slate-900 w-full max-w-sm rounded-2xl p-6 border border-slate-700 shadow-2xl">
            <h3 data-i18n="global_set" class="text-base font-bold mb-5 text-white flex items-center gap-2">🌐 系統全域設定</h3>
            <div class="space-y-5">
                <div>
                    <label data-i18n="lang_sel" class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">介面語言 (Language)</label>
                    <select id="app-language" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 text-sm focus:outline-none focus:border-emerald-500">
                        <option value="zh-TW">繁體中文 (Traditional Chinese)</option>
                        <option value="zh-CN">简体中文 (Simplified Chinese)</option>
                        <option value="en">English (英語)</option>
                    </select>
                </div>
                <div class="relative">
                    <label data-i18n="base_cur_sel" class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wider">計價本位幣 (Base Currency)</label>
                    <input type="text" id="base-currency-search" data-i18n-placeholder="ph_search_base" placeholder="🔍 搜尋幣種代碼 or 名稱..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 text-sm focus:outline-none focus:border-emerald-500" onclick="toggleBaseList(true)" onkeyup="filterBaseCurrencies()">
                    <div id="base-currency-list" class="absolute z-50 w-full max-h-48 overflow-y-auto bg-slate-900 border border-slate-700 rounded-lg mt-1 hidden shadow-xl no-scrollbar"></div>
                    <input type="hidden" id="selected-base-currency" value="TWD">
                </div>
            </div>
            <div class="flex space-x-3 mt-6">
                <button onclick="toggleGlobalSettings(false)" data-i18n="cancel" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 px-4 rounded-xl text-xs font-medium cursor-pointer">取消</button>
                <button onclick="saveGlobalSettings()" data-i18n="save" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 py-3 px-4 rounded-xl text-xs font-extrabold cursor-pointer">儲存設定</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 w-full max-w-sm rounded-2xl p-6 border border-slate-800 shadow-2xl flex flex-col max-h-[85vh]">
            <h3 data-i18n="custom_board" class="text-base font-bold mb-3 text-white flex items-center gap-2">⚙️ 自訂看板</h3>
            <div class="mb-3 relative">
                <input type="text" id="currency-search" onkeyup="handleSearch()" data-i18n-placeholder="ph_search_board" placeholder="🔍 搜尋代碼 or 名稱..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-200 text-sm focus:outline-none focus:border-emerald-500 placeholder-slate-600">
            </div>
            <div id="settings-checkboxes" class="space-y-1 bg-slate-800/50 p-2 rounded-xl border border-slate-700/50 overflow-y-auto no-scrollbar flex-1"></div>
            <div class="flex space-x-3 mt-4 pt-2">
                <button onclick="toggleSettingsModal(false)" data-i18n="cancel" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 px-4 rounded-xl text-xs font-medium cursor-pointer">取消</button>
                <button onclick="saveSettings()" data-i18n="save" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 py-3 px-4 rounded-xl text-xs font-extrabold cursor-pointer">儲存設定</button>
            </div>
        </div>
    </div>

    <div id="category-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 w-full max-w-sm rounded-2xl p-6 border border-slate-800 shadow-2xl flex flex-col max-h-[75vh]">
            <h3 data-i18n="manage_cat" class="text-base font-bold mb-3 text-white flex items-center gap-2">🏷️ 自訂資產類別管理</h3>
            <div class="flex gap-2 mb-4">
                <input type="text" id="new-category-input" data-i18n-placeholder="ph_new_cat" placeholder="輸入新類別名稱..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200 text-sm focus:outline-none focus:border-emerald-500">
                <button onclick="addCustomCategory()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-xs font-black px-4 rounded-xl cursor-pointer">+ 新增</button>
            </div>
            <div id="category-manager-list" class="space-y-2 overflow-y-auto no-scrollbar flex-1 bg-slate-850 p-2 rounded-xl border border-slate-800"></div>
            <button onclick="toggleCategoryModal(false)" data-i18n="btn_confirm" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-3 rounded-xl mt-4 cursor-pointer font-bold">完成</button>
        </div>
    </div>

    <div id="add-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 w-full max-w-sm rounded-2xl p-6 border border-slate-800 shadow-2xl">
            <h3 id="modal-title" class="text-base font-bold mb-4 text-white flex items-center gap-2">🌍 <span data-i18n="add_title">新增項目</span></h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">項目類型</label>
                    <div class="flex gap-2">
                        <button type="button" id="type-asset-btn" onclick="setRecordType('asset')" class="flex-1 py-2 rounded-xl text-xs font-bold border transition cursor-pointer bg-emerald-500 text-slate-950 border-emerald-500">💰 資產</button>
                        <button type="button" id="type-liability-btn" onclick="setRecordType('liability')" class="flex-1 py-2 rounded-xl text-xs font-bold border transition cursor-pointer bg-slate-950 text-slate-400 border-slate-800 hover:bg-slate-800">💳 負債</button>
                    </div>
                    <input type="hidden" id="asset-record-type" value="asset">
                </div>

                <div>
                    <label data-i18n="lbl_asset_type" class="block text-xs font-medium text-slate-400 mb-1">選擇幣別</label>
                    <div class="relative">
                        <input type="text" id="asset-symbol-search" onkeyup="filterAssetSymbols()" data-i18n-placeholder="ph_search_asset" placeholder="🔍 搜尋代碼 (如: BTC)..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 mb-2 text-slate-200 text-sm focus:outline-none focus:border-emerald-500 placeholder-slate-500" onclick="toggleAssetSearchList(true)">
                        <div id="asset-symbol-list" class="absolute z-50 w-full max-h-48 overflow-y-auto bg-slate-900 border border-slate-700 rounded-lg mt-1 hidden shadow-xl no-scrollbar"></div>
                        <input type="hidden" id="asset-symbol" value="">
                    </div>
                </div>
                
                <div>
                    <div class="flex justify-between items-end mb-1">
                        <label data-i18n="lbl_asset_cat" class="block text-xs font-medium text-slate-400">項目類別 / 分組</label>
                        <button type="button" onclick="quickAddCategory()" class="text-[10px] text-emerald-400 hover:text-emerald-300 bg-emerald-900/30 px-2 py-1 rounded cursor-pointer border border-emerald-800/50 transition-colors active:scale-95">+ 新增類別</button>
                    </div>
                    <select id="asset-category" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 text-sm focus:outline-none focus:border-emerald-500"></select>
                </div>

                <div>
                    <label data-i18n="lbl_asset_name" class="block text-xs font-medium text-slate-400 mb-1">自訂名稱</label>
                    <input id="asset-name" type="text" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label data-i18n="lbl_asset_amount" class="block text-xs font-medium text-slate-400 mb-1">數量</label>
                    <input id="asset-amount" type="number" step="any" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-200 text-sm focus:outline-none focus:border-emerald-500 font-mono">
                </div>
            </div>
            
            <div class="flex space-x-3 mt-6">
                <button onclick="toggleModal(false)" data-i18n="cancel" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 px-4 rounded-xl text-xs font-medium cursor-pointer">取消</button>
                <button id="modal-submit-btn" onclick="saveAsset()" data-i18n="btn_confirm" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 py-3 px-4 rounded-xl text-xs font-extrabold cursor-pointer">確認</button>
            </div>
        </div>
    </div>

    <div id="analysis-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-[70]">
        <div class="bg-slate-900 w-full max-w-sm rounded-3xl p-6 border border-slate-800 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-2">
                <h3 id="analysis-modal-title" class="text-base font-bold text-white flex items-center gap-2">📊 統計分析</h3>
                <button onclick="toggleAnalysisModal(false)" class="text-slate-400 hover:text-rose-400 font-bold transition p-2 text-sm cursor-pointer bg-slate-800/50 rounded-lg">✕</button>
            </div>
            
            <div class="flex gap-2 mb-2 mt-1">
                <button id="btn-analysis-asset" onclick="switchAnalysisMode('asset')" class="flex-1 py-2 rounded-xl text-xs font-bold transition border cursor-pointer bg-emerald-500/20 text-emerald-400 border-emerald-500/50">💰 資產比例</button>
                <button id="btn-analysis-liability" onclick="switchAnalysisMode('liability')" class="flex-1 py-2 rounded-xl text-xs font-bold transition border cursor-pointer bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700">💳 負債比例</button>
            </div>

            <div class="flex justify-center items-center my-4 relative">
                <svg id="analysis-svg" viewBox="0 0 100 100" class="w-44 h-44 drop-shadow-lg"></svg>
                <div class="absolute flex flex-col items-center justify-center text-center pointer-events-none">
                    <span id="analysis-center-title" class="text-[9px] text-slate-500 uppercase font-black tracking-widest">TOTAL</span>
                    <span id="analysis-center-value" class="text-sm font-black text-white font-mono mt-0.5 truncate max-w-[120px]">0</span>
                </div>
            </div>
            <div id="analysis-list" class="space-y-2 overflow-y-auto no-scrollbar flex-1 pr-0.5 pb-2"></div>
        </div>
    </div>

    <div id="quick-add-category-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-[80] opacity-100 transition-opacity">
        <div class="bg-slate-900 w-full max-w-xs rounded-2xl p-5 border border-slate-700 shadow-2xl transform transition-all scale-100">
            <h3 class="text-sm font-bold mb-4 text-white flex items-center gap-2">
                <span class="bg-emerald-500/20 text-emerald-400 p-1.5 rounded-lg">✨</span> 
                新增自訂類別
            </h3>
            <input type="text" id="quick-category-input" data-i18n-placeholder="ph_new_cat" placeholder="輸入新類別名稱..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-slate-200 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all mb-5 placeholder-slate-600">
            <div class="flex space-x-3">
                <button onclick="toggleQuickAddCategoryModal(false)" data-i18n="cancel" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 px-4 rounded-xl text-xs font-medium cursor-pointer transition active:scale-95">取消</button>
                <button onclick="confirmQuickAddCategory()" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-slate-950 py-2.5 px-4 rounded-xl text-xs font-extrabold cursor-pointer transition shadow-lg shadow-emerald-500/20 active:scale-95">確認新增</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🌍 核心狀態與資料庫
        // ==========================================
        let assets = JSON.parse(localStorage.getItem('lite_moze_v6_assets')) || [];
        let displayRates = JSON.parse(localStorage.getItem('lite_moze_v6_settings')) || ['USD', 'EUR', 'JPY', 'BTC', 'ETH'];
        let appConfig = JSON.parse(localStorage.getItem('lite_moze_v6_config')) || { baseCurrency: 'TWD', language: 'zh-TW' };
        
        let defaultCategories = ['cat_cash', 'cat_bank', 'cat_invest', 'cat_crypto', 'cat_other'];
        let customCategories = JSON.parse(localStorage.getItem('lite_moze_v6_categories')) || defaultCategories;
        
        let currentEditAssetId = null; 
        let ratesBaseUSD = { USD: 1 }; 

        const currencyInfo = {
            TWD: { icon: '🇹🇼', type: 'fiat' }, USD: { icon: '🇺🇸', type: 'fiat' },
            EUR: { icon: '🇪🇺', type: 'fiat' }, JPY: { icon: '🇯🇵', type: 'fiat' },
            HKD: { icon: '🇭🇰', type: 'fiat' }, GBP: { icon: '🇬🇧', type: 'fiat' },
            AUD: { icon: '🇦🇺', type: 'fiat' }, CAD: { icon: '🇨🇦', type: 'fiat' },
            SGD: { icon: '🇸🇬', type: 'fiat' }, CHF: { icon: '🇨🇭', type: 'fiat' },
            CNY: { icon: '🇨🇳', type: 'fiat' }, KRW: { icon: '🇰🇷', type: 'fiat' },
            MYR: { icon: '🇲🇾', type: 'fiat' }, NZD: { icon: '🇳🇿', type: 'fiat' },
            THB: { icon: '🇹🇭', type: 'fiat' }, PHP: { icon: '🇵🇭', type: 'fiat' },
            IDR: { icon: '🇮🇩', type: 'fiat' }, VND: { icon: '🇻🇳', type: 'fiat' },
            INR: { icon: '🇮🇳', type: 'fiat' }, DKK: { icon: '🇩🇰', type: 'fiat' },
            BTC: { icon: '🪙', type: 'crypto' }, ETH: { icon: '🪙', type: 'crypto' },
            USDT: { icon: '💵', type: 'crypto' }, BNB: { icon: '🪙', type: 'crypto' },
            SOL: { icon: '🪙', type: 'crypto' }, XRP: { icon: '🪙', type: 'crypto' },
            USDC: { icon: '💵', type: 'crypto' }, ADA: { icon: '🪙', type: 'crypto' },
            DOGE: { icon: '🐕', type: 'crypto' }, SHIB: { icon: '🐕', type: 'crypto' }
        };

        // ==========================================
        // 🌐 i18n 國際化翻譯字典
        // ==========================================
        const i18n = {
            'zh-TW': {
                app_sub: '專屬國際資產版', net_worth: '總資產淨值估算', custom_board: '⚙️ 自訂看板',
                my_assets: '我的資產帳戶', add_record: '+ 新增項目紀錄', global_set: '🌐 系統全域設定',
                lang_sel: '介面語言', base_cur_sel: '計價本位幣', cancel: '取消', save: '儲存設定',
                add_title: '新增紀錄項目', edit_title: '編輯紀錄項目', btn_confirm: '確認',
                lbl_asset_type: '選擇幣別', lbl_asset_name: '自訂名稱 (選填)', lbl_asset_amount: '數量',
                items: '個項目', del_conf: '確認刪除此項目？', not_found: '找不到相符的幣種', base_asset: '基準資產',
                status_syncing: '同步中...', status_live: 'LIVE 同步 (15s)', status_offline: '離線模式',
                group_fiat: '🌍 法定貨幣', group_crypto: '🪙 加密貨幣',
                ph_search_base: '🔍 搜尋幣種代碼或名稱...', ph_search_board: '🔍 搜尋代碼 or 名稱...', 
                ph_search_asset: '🔍 搜尋代碼 (如: BTC, USD)...', ph_name: '自訂名稱 (如: 銀行帳戶, 交易所)', ph_amount: '輸入數量',
                cur_TWD: '新台幣', cur_USD: '美元', cur_EUR: '歐元', cur_JPY: '日圓', cur_HKD: '港幣', cur_GBP: '英鎊', cur_AUD: '澳幣', cur_CAD: '加幣', cur_SGD: '新加坡元', cur_CHF: '瑞士法郎', cur_CNY: '人民幣', cur_KRW: '韓圓', cur_MYR: '馬來西亞令吉', cur_NZD: '紐西蘭元', cur_THB: '泰銖', cur_PHP: '菲律賓披索', cur_IDR: '印尼盾', cur_VND: '越南盾', cur_INR: '印度盧比', cur_DKK: '丹麥克朗',
                cur_BTC: '比特幣', cur_ETH: '以太幣', cur_USDT: '泰達幣 (USDT)', cur_BNB: '幣安幣 (BNB)', cur_SOL: '索拉納 (SOL)', cur_XRP: '瑞波幣 (XRP)', cur_USDC: 'USD Coin', cur_ADA: '艾達幣 (ADA)', cur_DOGE: '狗狗幣', cur_SHIB: '柴犬幣',
                btn_group_stat: '📊 分組統計', btn_cur_stat: '🪙 幣種統計',
                chart_group_title: '📊 資產分組比例統計', chart_cur_title: '🪙 持有幣種分佈統計',
                lbl_asset_cat: '項目類別 / 分組', no_chart_data: '尚無可以分析的資產數據',

        function getTranslation(key) {
            if (!key) return '';
            const lang = appConfig.language || 'zh-TW';
            const dict = i18n[lang] || i18n['zh-TW'];
            return dict[key] !== undefined ? dict[key] : key;
        }

        function getCurrencyName(symbol) {
            return getTranslation('cur_' + symbol) || symbol;
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = getTranslation(key);
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.placeholder = getTranslation(key);
            });

            document.getElementById('asset-name').placeholder = getTranslation('ph_name');
            document.getElementById('asset-amount').placeholder = getTranslation('ph_amount');
            document.getElementById('app-language').value = appConfig.language;
            document.getElementById('account-count').innerText = `${assets.length} ${getTranslation('items')}`;
        }

        function getAssetValueInBase(symbol, amount) {
            if (!ratesBaseUSD[symbol] || !ratesBaseUSD[appConfig.baseCurrency]) return 0;
            const valueInUSD = amount / ratesBaseUSD[symbol];
            return valueInUSD * ratesBaseUSD[appConfig.baseCurrency];
        }

        function formatDisplayAmount(value, currencySym) {
            const info = currencyInfo[currencySym];
            if (!info) return value.toFixed(2);
            if (info.type === 'crypto') {
                return value < 1 ? value.toFixed(6) : value.toLocaleString(undefined, {maximumFractionDigits: 4});
            }
            const zeroDecimals = ['TWD', 'JPY', 'KRW', 'VND', 'IDR', 'CLP'];
            if (zeroDecimals.includes(currencySym)) return Math.round(value).toLocaleString();
            return value.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        function renderCategoryManagerList() {
            const container = document.getElementById('category-manager-list');
            container.innerHTML = '';
            customCategories.forEach((cat, idx) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-slate-900 border border-slate-800 p-2.5 rounded-xl";
                div.innerHTML = `
                    <span class="text-xs font-bold text-slate-200">${getTranslation(cat)}</span>
                    <button onclick="deleteCustomCategory(${idx})" class="text-slate-500 hover:text-rose-400 p-1 transition cursor-pointer">✕</button>

                container.appendChild(div);
            });

        }

        function addCustomCategory() {
            const input = document.getElementById('new-category-input');
            const name = input.value.trim();
            if(!name) return;
            if(customCategories.includes(name)) { alert('類別已存在'); return; }
            customCategories.push(name);
            localStorage.setItem('lite_moze_v6_categories', JSON.stringify(customCategories));
            input.value = '';
            renderCategoryManagerList();
        }

        function deleteCustomCategory(index) {
            customCategories.splice(index, 1);
            localStorage.setItem('lite_moze_v6_categories', JSON.stringify(customCategories));
            renderCategoryManagerList();
        }

        function renderCategoryOptions() {
            const select = document.getElementById('asset-category');
            if(!select) return;
            select.innerHTML = '';
            customCategories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat; 
                opt.innerText = getTranslation(cat); 
                select.appendChild(opt);
            });

            const input = document.getElementById('quick-category-input');

                    customCategories.push(name);
                    localStorage.setItem('lite_moze_v6_categories', JSON.stringify(customCategories));
                    renderCategoryOptions();

        function toggleAssetSearchList(show) {
            document.getElementById('asset-symbol-list').classList.toggle('hidden', !show);
        }

        function filterAssetSymbols() {
            const input = document.getElementById('asset-symbol-search');
            const filter = input.value.toUpperCase();
            const list = document.getElementById('asset-symbol-list');
            list.classList.remove('hidden');
            list.innerHTML = '';

            Object.entries(currencyInfo).forEach(([symbol, info]) => {
                const curName = getCurrencyName(symbol);
                if (symbol.toUpperCase().includes(filter) || curName.toUpperCase().includes(filter)) {
                    const div = document.createElement('div');
                    div.className = "p-3 hover:bg-slate-800 cursor-pointer text-sm text-slate-200 flex justify-between border-b border-slate-800/50 last:border-0";
                    div.innerHTML = `<span>${info.icon} <span class="font-mono font-bold">${symbol}</span></span><span class="text-slate-500 text-xs">${curName}</span>`;
                    div.onclick = () => selectAssetSymbol(symbol);
                    list.appendChild(div);
                }
            });
            if (list.innerHTML === '') {
                list.innerHTML = `<div class="p-3 text-xs text-slate-500 text-center">${getTranslation('not_found')}</div>`;
            }
        }

        function selectAssetSymbol(symbol) {
            const info = currencyInfo[symbol];
            if (info) {
                document.getElementById('asset-symbol-search').value = `${info.icon} ${symbol} (${getCurrencyName(symbol)})`;
                document.getElementById('asset-symbol').value = symbol;
                
                if(info.type === 'crypto') {
                    const found = customCategories.find(c => c === 'cat_crypto' || c.includes('加密') || c.toUpperCase().includes('CRYPTO'));
                    if(found) document.getElementById('asset-category').value = found;
                }
            }
            toggleAssetSearchList(false);
        }

            document.getElementById('base-currency-list').classList.toggle('hidden', !show);
        }

        function filterBaseCurrencies() {
            const input = document.getElementById('base-currency-search');
            const filter = input.value.toUpperCase();
            const list = document.getElementById('base-currency-list');
            list.classList.remove('hidden');
            list.innerHTML = '';

            let fiatHtml = `<div class="px-2 pt-2 pb-1 text-[10px] text-slate-500 font-bold uppercase tracking-wider">${getTranslation('group_fiat')}</div>`;
            let cryptoHtml = `<div class="px-2 pt-3 pb-1 text-[10px] text-slate-500 font-bold uppercase tracking-wider">${getTranslation('group_crypto')}</div>`;
            
            let hasFiat = false, hasCrypto = false;

            Object.entries(currencyInfo).forEach(([symbol, info]) => {
                const curName = getCurrencyName(symbol);
                if (symbol.toUpperCase().includes(filter) || curName.toUpperCase().includes(filter)) {
                    const itemHtml = `
                        <div class="p-3 hover:bg-slate-800 cursor-pointer text-sm text-slate-200 flex justify-between border-b border-slate-800/50 last:border-0" onclick="selectBaseCurrency('${symbol}')">
                            <span>${info.icon} <span class="font-mono font-bold">${symbol}</span></span><span class="text-slate-500 text-xs">${curName}</span>
                        </div>`;
                    if(info.type === 'crypto') { cryptoHtml += itemHtml; hasCrypto = true; }
                    else { fiatHtml += itemHtml; hasFiat = true; }
                }
            });
            
            if(!hasFiat && !hasCrypto) list.innerHTML = `<div class="p-3 text-xs text-slate-500 text-center">${getTranslation('not_found')}</div>`;
            else list.innerHTML = (hasFiat ? fiatHtml : '') + (hasCrypto ? cryptoHtml : '');
        }

        function selectBaseCurrency(symbol) {
            const info = currencyInfo[symbol];
            document.getElementById('base-currency-search').value = `${info.icon} ${symbol} (${getCurrencyName(symbol)})`;
            document.getElementById('selected-base-currency').value = symbol;
            toggleBaseList(false);
        }

            document.getElementById('asset-record-type').value = type;
            const assetBtn = document.getElementById('type-asset-btn');

            if (type === 'asset') {

                liabBtn.className = "flex-1 py-2 rounded-xl text-xs font-bold border transition cursor-pointer bg-slate-950 text-slate-400 border-slate-800 hover:bg-slate-800";

            }

        function toggleModal(show, assetId = null) {
            const modal = document.getElementById('add-modal');
            const titleEl = document.querySelector('#modal-title span');
            modal.classList.toggle('hidden', !show);

            if(show) {
                renderCategoryOptions(); 
                currentEditAssetId = assetId;
                if(assetId) {
                    titleEl.innerText = getTranslation('edit_title');
                    const asset = assets.find(a => a.id === assetId);
                    if(asset) {
                        setRecordType(asset.recordType || 'asset');
                        selectAssetSymbol(asset.symbol);
                        document.getElementById('asset-name').value = asset.name;
                        document.getElementById('asset-amount').value = asset.amount;
                        document.getElementById('asset-category').value = asset.category || customCategories[0] || '';
                    }
                } else {
                    titleEl.innerText = getTranslation('add_title');
                    setRecordType('asset');
                    document.getElementById('asset-symbol-search').value = '';
                    document.getElementById('asset-symbol').value = '';
                    document.getElementById('asset-name').value = '';
                    document.getElementById('asset-amount').value = '';
                    if(customCategories.length > 0) document.getElementById('asset-category').value = customCategories[0];
                    filterAssetSymbols();
                }
            }
        }

        // ==========================================
        // 📝 資產與看板渲染
        // ==========================================
        function saveAsset() {
            const symbol = document.getElementById('asset-symbol').value;
            const name = document.getElementById('asset-name').value.trim();
            const amount = parseFloat(document.getElementById('asset-amount').value);
            const category = document.getElementById('asset-category').value; 
            const recordType = document.getElementById('asset-record-type').value;

            if(!symbol || isNaN(amount)) { alert("Error: Invalid Input"); return; }

            if(currentEditAssetId) {
                const asset = assets.find(a => a.id === currentEditAssetId);
                if(asset) { 
                    asset.symbol = symbol; 
                    asset.name = name; 
                    asset.amount = amount; 
                    asset.category = category; 
                    asset.recordType = recordType;
                }
            } else {
                assets.push({ id: Date.now().toString(), symbol, name, amount, category, recordType });
            }

            localStorage.setItem('lite_moze_v6_assets', JSON.stringify(assets));
            toggleModal(false);
            renderAssets();
        }

        function deleteAsset(id) {
            if(confirm(getTranslation('del_conf'))) {
                assets = assets.filter(a => a.id !== id);
                localStorage.setItem('lite_moze_v6_assets', JSON.stringify(assets));
                renderAssets();
            }
        }

        function renderAssets() {
            const list = document.getElementById('asset-list');
            if(!list) return;
            list.innerHTML = '';
            
            const base = appConfig.baseCurrency || 'TWD';
            document.getElementById('display-base-currency').innerText = base;
            document.getElementById('account-count').innerText = `${assets.length} ${getTranslation('items')}`;

            let totalBaseValue = 0;

            assets.forEach(asset => {
                const info = currencyInfo[asset.symbol] || { icon: '🪙', type: 'fiat' };
                const valueInBase = getAssetValueInBase(asset.symbol, asset.amount);
                
                // 🌟 核心算法優化：若為負債，在主頁面中應為「扣除項」
                const isLiability = asset.recordType === 'liability';
                if (isLiability) {
                    totalBaseValue -= valueInBase;
                } else {
                    totalBaseValue += valueInBase;
                }

                const displayName = asset.name ? asset.name : getCurrencyName(asset.symbol);
                const formattedAmount = formatDisplayAmount(asset.amount, asset.symbol);
                const formattedBaseVal = formatDisplayAmount(valueInBase, base);

                // 動態加上負債特殊徽章
                const typeBadge = isLiability ? `<span class="text-[9px] bg-rose-500/20 text-rose-400 px-1.5 py-0.5 rounded-md font-medium tracking-wide shadow-sm">負債</span>` : '';
                const catBadge = asset.category ? `<span class="text-[9px] bg-slate-700/60 text-slate-300 px-1.5 py-0.5 rounded-md font-medium tracking-wide shadow-sm">${getTranslation(asset.category)}</span>` : '';

                let subtext = `${formattedAmount} ${asset.symbol}`;
                if (asset.symbol !== base) subtext += ` ≈ ${base} ${formattedBaseVal}`;
                else subtext = `${getTranslation('base_asset')}`;

                const valueColorClass = isLiability ? 'text-rose-400' : 'text-emerald-400';
                const displayPrefix = isLiability ? '-' : '';

                const div = document.createElement('div');
                div.className = "bg-slate-800/40 border border-slate-800 p-4 rounded-2xl flex justify-between items-center hover:border-slate-700 transition";
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="text-2xl">${info.icon}</div>
                        <div>
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-sm font-bold text-slate-100">${displayName}</span>
                                ${typeBadge}
                                ${catBadge}
                            </div>
                            <div class="text-[11px] text-slate-400 font-mono">${subtext}</div>
                        </div>
                    </div>
                    <div class="text-right flex items-center gap-2">
                        <span class="text-sm font-mono font-bold ${valueColorClass} mr-1">${displayPrefix}${base} ${formattedBaseVal}</span>
                        <button onclick="toggleModal(true, '${asset.id}')" class="text-slate-500 hover:text-amber-400 p-1 text-xs transition cursor-pointer">✏️</button>
                        <button onclick="deleteAsset('${asset.id}')" class="text-slate-500 hover:text-rose-400 p-1 text-xs transition cursor-pointer">✕</button>
                    </div>
                `;
                list.appendChild(div);
            });

            const totalAssetsEl = document.getElementById('total-assets');
            if (totalBaseValue < 0) {
                totalAssetsEl.className = "text-3xl font-black tracking-tight text-rose-400 font-mono relative z-10";
                totalAssetsEl.innerText = `-${base} ${formatDisplayAmount(Math.abs(totalBaseValue), base)}`;
            } else {
                totalAssetsEl.className = "text-3xl font-black tracking-tight text-white font-mono relative z-10";
                totalAssetsEl.innerText = `${base} ${formatDisplayAmount(totalBaseValue, base)}`;
            }
        }

                        <span class="group-hover:text-slate-300 transition flex items-center gap-1.5">
                            <span class="text-sm">${info.icon}</span> 
                            <span>${sym}/${base} <span class="text-[10px] text-slate-500">(${curName})</span>:</span>
                        </span>
                        <span class="text-emerald-400 font-bold font-mono">${displayVal}</span>
                    `;
                    container.appendChild(div);
                }
            });
        }

        // ==========================================
        // 📊 圖表分析演算法與渲染邏輯（雙模式整合）
        // ==========================================
        let currentAnalysisType = 'group'; 
        let currentAnalysisRecordType = 'asset'; 

        function toggleAnalysisModal(show) {
            document.getElementById('analysis-modal').classList.toggle('hidden', !show);
        }

        function openAnalysisModal(analysisType) {
            currentAnalysisType = analysisType;
            currentAnalysisRecordType = 'asset'; // 預設先看資產
            toggleAnalysisModal(true);
            renderAnalysisChart();
        }

        function switchAnalysisMode(recordType) {
            currentAnalysisRecordType = recordType;
            renderAnalysisChart();
        }

        function renderAnalysisChart() {
            const base = appConfig.baseCurrency || 'TWD';
            const titleEl = document.getElementById('analysis-modal-title');
            
            const btnAsset = document.getElementById('btn-analysis-asset');
            const btnLiab = document.getElementById('btn-analysis-liability');
            
            // 動態切換上方按鈕與標題 UI 樣式
            if (currentAnalysisRecordType === 'asset') {
                btnAsset.className = "flex-1 py-2 rounded-xl text-xs font-bold transition border cursor-pointer bg-emerald-500/20 text-emerald-400 border-emerald-500/50";
                btnLiab.className = "flex-1 py-2 rounded-xl text-xs font-bold transition border cursor-pointer bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700";
                titleEl.innerText = currentAnalysisType === 'group' ? getTranslation('chart_group_title') : getTranslation('chart_cur_title');
            } else {
                btnLiab.className = "flex-1 py-2 rounded-xl text-xs font-bold transition border cursor-pointer bg-rose-500/20 text-rose-400 border-rose-500/50";
                btnAsset.className = "flex-1 py-2 rounded-xl text-xs font-bold transition border cursor-pointer bg-slate-800 text-slate-400 border-slate-700 hover:bg-slate-700";
                titleEl.innerText = currentAnalysisType === 'group' ? '📊 負債分組比例統計' : '🪙 負債幣種分佈統計';
            }
            
            let totalValue = 0;
            const dataMap = {};
            
            // 依據目前點選的模式過濾目標資產或負債
            const targetAssets = assets.filter(a => (a.recordType || 'asset') === currentAnalysisRecordType);
            
            targetAssets.forEach(asset => {
                const valueInBase = getAssetValueInBase(asset.symbol, asset.amount);
                totalValue += valueInBase;
                
                let key, label;
                if (currentAnalysisType === 'group') {
                    key = getTranslation(asset.category) || getTranslation('unclassified');
                    label = key;
                } else {
                    key = asset.symbol;
                    label = `${currencyInfo[key]?.icon || '🪙'} ${key}`;
                }
                
                if (!dataMap[key]) {
                    dataMap[key] = { label: label, value: 0 };
                }
                dataMap[key].value += valueInBase;
            });
            
            const chartData = Object.keys(dataMap).map(k => ({
                key: k,
                label: dataMap[k].label,
                value: dataMap[k].value
            })).sort((a, b) => b.value - a.value);
            
            // 🌟 亮點：資產（綠翠綠色系）與負債（鮮紅橘色系）使用獨立調色盤，完美提升視覺識別度
            const assetColors = ['#10b981', '#84cc16', '#06b6d4', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6', '#14b8a6', '#f43f5e', '#a855f7'];
            const liabilityColors = ['#f43f5e', '#fb923c', '#ec4899', '#d946ef', '#8b5cf6', '#ef4444', '#f59e0b', '#e11d48', '#c026d3', '#db2777'];
            const activeColors = currentAnalysisRecordType === 'asset' ? assetColors : liabilityColors;

            chartData.forEach((item, idx) => {
                item.color = activeColors[idx % activeColors.length];
            });
            
            document.getElementById('analysis-center-title').innerText = base;
            document.getElementById('analysis-center-value').innerText = formatDisplayAmount(totalValue, base);
            
            const svgContainer = document.getElementById('analysis-svg');
            const radius = 38; 
            const circumference = 2 * Math.PI * radius; 
            let accumulatedStrokeOffset = 0;
            let svgContentHtml = '';
            
            if (totalValue === 0 || chartData.length === 0) {
                svgContentHtml = `<circle cx="50" cy="50" r="${radius}" fill="transparent" stroke="#334155" stroke-width="8"/>`;
            } else {
                chartData.forEach(item => {
                    const slicePercentage = item.value / totalValue;
                    const strokeLength = slicePercentage * circumference;
                    const displayStroke = strokeLength === circumference ? circumference - 0.01 : strokeLength;
                    
                    svgContentHtml += `
                        <circle cx="50" cy="50" r="${radius}" 
                                fill="transparent" 
                                stroke="${item.color}" 
                                stroke-width="8" 
                                stroke-dasharray="${displayStroke} ${circumference}" 
                                stroke-dashoffset="${-accumulatedStrokeOffset}" 
                                transform="rotate(-90 50 50)"
                                class="transition-all duration-300 hover:stroke-[10px] cursor-pointer"/>
                    `;
                    accumulatedStrokeOffset += strokeLength;
                });
            }
            svgContainer.innerHTML = svgContentHtml;
            
            const listContainer = document.getElementById('analysis-list');
            listContainer.innerHTML = '';
            
            if (chartData.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-xs text-slate-500 py-8">尚無資料可供分析</div>`;
                return;
            }
            
            const textColorClass = currentAnalysisRecordType === 'asset' ? 'text-emerald-400' : 'text-rose-400';

            chartData.forEach(item => {
                const percentageStr = totalValue > 0 ? ((item.value / totalValue) * 100).toFixed(1) : '0.0';
                const formattedValueText = formatDisplayAmount(item.value, base);
                
                const itemDiv = document.createElement('div');
                itemDiv.className = "flex justify-between items-center bg-slate-800/40 border border-slate-800/60 rounded-xl p-3 hover:bg-slate-800/80 transition duration-150 mb-1.5";
                itemDiv.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <span class="w-3 h-3 rounded-full shrink-0 shadow-sm" style="background-color: ${item.color}"></span>
                        <span class="text-xs font-bold text-slate-200">${item.label}</span>
                        <span class="text-[10px] text-slate-400 font-mono bg-slate-950 px-1.5 py-0.5 rounded-md font-semibold">${percentageStr}%</span>
                    </div>
                    <div class="text-right font-mono text-xs font-black ${textColorClass}">
                        ${base} ${formattedValueText}
                    </div>
                `;
                listContainer.appendChild(itemDiv);
            });
        }

        // ==========================================
        // 📡 API 核心同步
        // ==========================================
        async function fetchMarketData() {
            const status = document.getElementById('sync-status');
            status.innerText = getTranslation('status_syncing');
            status.className = "text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded-full font-mono font-bold tracking-wider";
            
            let fiatSuccess = false;
            let cryptoSuccess = false;

            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                if(res.ok) {
                    const data = await res.json();
                    ratesBaseUSD = { ...ratesBaseUSD, ...data.rates };
                    fiatSuccess = true;
                }
            } catch(e) {}

            try {
                const res = await fetch('https://api.binance.com/api/v3/ticker/price');
                if(res.ok) {
                    const data = await res.json();
                    const tMap = {}; data.forEach(t => tMap[t.symbol] = parseFloat(t.price));
                    for (const sym in currencyInfo) {
                        if(currencyInfo[sym].type === 'crypto' && tMap[sym+'USDT']) {
                            ratesBaseUSD[sym] = 1 / tMap[sym+'USDT'];
                        }
                    }
                    ratesBaseUSD['USDT'] = 1; ratesBaseUSD['USDC'] = 1;
                    cryptoSuccess = true;
                }
            } catch(e) {}

            if(fiatSuccess || cryptoSuccess) {
                status.innerText = getTranslation('status_live');
                status.className = "text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded-full font-mono font-bold tracking-wider";
            } else {
                status.innerText = getTranslation('status_offline');
                status.className = "text-[10px] bg-rose-500/10 text-rose-400 px-2 py-1 rounded-full font-mono font-bold tracking-wider";
            }

            renderDashboardRates();
            renderAssets();
        }

        // ==========================================
        // 🚀 啟動鏈
        // ==========================================
        renderCategoryOptions();
        applyTranslations();
        fetchMarketData();
        setInterval(fetchMarketData, 15000); 
    </script>
</body>
</html>
